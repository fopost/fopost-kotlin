name: Release

# Tag the commit as v<version> matching gradle.properties, e.g. v0.1.0.
# Publishing needs four secrets on the `central` environment:
# MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Gates publishing behind a dedicated environment, so commit access alone
    # does not grant the ability to push a release to Maven Central.
    environment:
      name: central
      url: https://central.sonatype.com/artifact/com.fopost/fopost-kotlin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          [ "$VERSION" = "$TAG" ] || { echo "::error::gradle.properties is $VERSION but the tag is $TAG"; exit 1; }

      # The version constant is compiled into the User-Agent, so a stale one is
      # invisible until someone reads a server log.
      - name: Verify the version constant matches
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          grep -q "SDK_VERSION: String = \"$VERSION\"" src/main/kotlin/com/fopost/internal/Version.kt \
            || { echo "::error::Version.kt does not say $VERSION"; exit 1; }

      - run: ./gradlew build

      - name: Publish to Maven Central
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
